<!doctype html>
<html lang="en" class="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Reference parts gallery</title>
  <script src="../../theme/early.js"></script>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <script src="../installable.js"></script>
  <link rel="stylesheet" href="https://design.flamingbeing.com/v1/tokens.css">
  <link rel="stylesheet" href="../../theme/theme.css">
  <link rel="stylesheet" href="../../ui/ui.css">
  <link rel="stylesheet" href="../../theme/glass.css">
  <link rel="stylesheet" href="../../ui/gestures.css">
  <link rel="stylesheet" href="page.css">
  <script type="module" src="page.js"></script>
</head>
<body>
  <!-- The reference parts on made-up data, signed out: undo toast, loading and error states, About sheet.
       Tests: docs/kit-tests.md. -->
  <header class="ui-bar">
    <a class="ui-back kit-home" href="../">Gallery</a>
    <h2 class="ui-bar-title" aria-hidden="true">Parts</h2>
    <span class="kit-bar-side"></span>
  </header>

  <main>
    <h1 class="ui-large-title">Parts</h1>

    <section aria-labelledby="undo-title">
      <h2 id="undo-title">Undo toast</h2>
      <ul id="fruit" class="parts-list"></ul>
      <p class="small">Delete a row: it goes at once and Undo puts it back. A second delete replaces the first toast.</p>
    </section>

    <section aria-labelledby="load-title">
      <h2 id="load-title">Loading and errors</h2>
      <div class="row">
        <button type="button" id="load-run">Load</button>
        <button type="button" id="load-fail">Fail</button>
      </div>
      <div id="load-host"></div>
      <ul id="loaded" class="parts-list" hidden></ul>
    </section>

    <section aria-labelledby="about-title-h">
      <h2 id="about-title-h">About</h2>
      <button type="button" id="about-open">About this app</button>
    </section>
  </main>
</body>
</html>
