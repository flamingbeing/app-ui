<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <title>Vault shell gallery</title>
  <script src="../../theme/early.js"></script>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <script src="../installable.js"></script>
  <link rel="stylesheet" href="https://design.flamingbeing.com/v1/tokens.css">
  <link rel="stylesheet" href="../../theme/theme.css">
  <link rel="stylesheet" href="../../ui/ui.css">
  <link rel="stylesheet" href="../../ui/gestures.css">
  <link rel="stylesheet" href="page.css">
  <script type="module" src="page.js"></script>
</head>
<body>
  <!-- The vault shell (ui/vault/, opt-in: import ui/vault/index.js) on a made-up field journal: the floating
       navigation pill (Back, Forward, Search, +, the open tabs' count, Menu) and the grouped menu sheets (the page's
       More menu, the app menu, a picker, the open tabs). The page's own first Back says "Press Back again to close"
       (tabBack's guard); closing a sheet never does. Tests: docs/kit-tests.md, "Vault shell". -->
  <header class="kit-vault-head">
    <a class="kit-vault-home" href="../">Gallery</a>
    <h1 class="kit-vault-title" id="page-title">Fern walk</h1>
    <button type="button" id="more" class="kit-vault-more" aria-label="More options"></button>
  </header>
  <main class="kit-vault-page" id="page">
    <p id="page-body"></p>
    <p class="kit-vault-lede">The pill's Back and Forward step through the pages seen here; Search picks a page; + opens
      a new tab; the box shows how many are open; Menu is the app's menu. The dots at the top are this page's menu.</p>
    <label class="kit-vault-label" for="jot">A quick note (the pill steps aside while the keyboard is up)</label>
    <input type="text" id="jot" class="kit-vault-input" autocomplete="off" placeholder="Type here">
  </main>
</body>
</html>
