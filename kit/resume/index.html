<!doctype html>
<html lang="en" class="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Warm start gallery</title>
  <script src="../../theme/early.js"></script>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <script src="../installable.js"></script>
  <link rel="stylesheet" href="https://design.flamingbeing.com/v1/tokens.css">
  <link rel="stylesheet" href="../../theme/theme.css">
  <link rel="stylesheet" href="../../ui/ui.css">
  <link rel="stylesheet" href="../../theme/glass.css">
  <link rel="stylesheet" href="../../ui/gestures.css">
  <link rel="stylesheet" href="page.css">
  <script type="module" src="page.js"></script>
</head>
<body>
  <!-- Warm start (startGestures(document, { resume: true })) on a made-up reading list: pick a tab, scroll, reload or
       leave and come back within the hour, and it opens on that tab at that scroll, with no first tab shown first.
       Any ?query or #hash in the address is a deep link and starts as usual. Tests: docs/kit-tests.md. -->
  <header class="ui-bar">
    <span class="kit-bar-side"><a class="ui-back kit-home" href="../">Gallery</a></span>
    <h2 class="ui-bar-title" aria-hidden="true">Reading</h2>
    <span class="kit-bar-side"><button type="button" id="share" class="ui-icon-btn" aria-label="Share this screen"></button></span>
  </header>

  <main class="ui-screens">
    <section class="ui-screen" id="inbox" aria-labelledby="inbox-title">
      <h1 class="ui-large-title" id="inbox-title">Inbox</h1>
      <p class="kit-lede" id="how" role="status"></p>
      <p class="kit-actions"><button type="button" id="forget">Forget the kept place</button></p>
      <ul class="ui-list" id="inbox-list" aria-label="Inbox"></ul>
    </section>
    <section class="ui-screen" id="later" aria-labelledby="later-title" hidden>
      <h1 class="ui-large-title" id="later-title">Later</h1>
      <ul class="ui-list" id="later-list" aria-label="Later"></ul>
    </section>
    <section class="ui-screen" id="done" aria-labelledby="done-title" hidden>
      <h1 class="ui-large-title" id="done-title">Done</h1>
      <p class="kit-lede">This list is drawn a moment after the page starts, as an app's rows come from its store: the
        kept scroll is held until they are there.</p>
      <ul class="ui-list" id="done-list" aria-label="Done"></ul>
    </section>
    <section class="ui-screen" id="item" aria-labelledby="item-title" hidden>
      <button type="button" class="ui-back">Back</button>
      <h1 class="ui-large-title" id="item-title">Article</h1>
      <p class="kit-lede">A pushed screen is not kept: a warm start opens the tab it was pushed over.</p>
    </section>
  </main>

  <nav class="ui-tabbar" aria-label="Sections">
    <button type="button" class="ui-tab" data-tab-page="#inbox" aria-current="page"><span class="ui-tab-icon" data-icon="inbox" aria-hidden="true"></span>Inbox</button>
    <button type="button" class="ui-tab" data-tab-page="#later"><span class="ui-tab-icon" data-icon="later" aria-hidden="true"></span>Later</button>
    <button type="button" class="ui-tab" data-tab-page="#done"><span class="ui-tab-icon" data-icon="done" aria-hidden="true"></span>Done</button>
  </nav>
</body>
</html>
