# Once the quick Checks pass on a push to main (and by hand): tag the version if it is new, then deploy this repo's
# Worker (core.anawj.com/ui/*).
# Tag: if package.json's version has no tag yet, tag that commit vX.Y.Z (the version must be in versions.lock.json:
# tools/build-ui.mjs --check). An existing tag is never moved or replaced (versions are immutable).
# Deploy (after the tag, so a new version is served by the same run): builds dist/ from every release tag
# (tools/build-ui.mjs), which fails if a released version no longer matches versions.lock.json.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the deploy says so and skips.
name: Deploy

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Tag the version if it is new
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          node tools/build-ui.mjs --check
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then echo "$v exists; nothing to do"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "app-ui ${v#v}" "$SHA"
          git push origin "refs/tags/$v"
          echo "tagged $v at $SHA"

  deploy:
    needs: tag
    uses: flamingbeing/app-devkit/.github/workflows/deploy-worker.yml@v1.11.0
    with:
      build-command: git fetch --tags --force --quiet && node tools/build-ui.mjs   # dist/ui/<x.y.z>/ from the release tags
      beta-env: false
    secrets: inherit
