# Nightly soak (app-devkit README, "soak.yml"): the Chromium browser tests 5 times, then 2 more under a slow-phone
# profile, and the unit tests 100 times, no retries, at 02:30 SGT. A failure opens or updates ONE issue titled "Nightly
# soak"; it closes after 7 clean nights. Not a required check, never blocks a PR. Also runs by hand (Actions, "Nightly
# soak", Run workflow). The `full` job runs Full checks (full-checks.yml: WebKit, the jank gate, the @full axe
# runs) on main each night too; a failure shows as a red run. On demand, every spec in all three browsers on any
# machine with podman or docker: app-devkit `tools/pw-run.sh flamingbeing/app-ui [ref]`.
name: Nightly soak
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  soak:
    uses: flamingbeing/app-devkit/.github/workflows/soak.yml@v1.18.1
    with:
      # Sized to the soak's step limits (normal 60 min, slow phone 40). One run of the suite takes about 6 min on the
      # soak runner (a batch of 5: 30 min, Nov 2026) and a slow-phone run about twice that. At 10 runs the normal step
      # hit its limit; a step killed on its limit leaves its web server on 4174, so the slow-phone step then died on
      # "localhost:4174 ... is already used" (issue #72). Raise these only with the times in view.
      repeat: 5
      slow-repeat: 2
      test-command: npx playwright test --project=phone
      unit-command: node --test 'worker/test/*.test.mjs' 'test/*.unit.test.mjs' 'tools/test/*.test.mjs'
  full:
    uses: ./.github/workflows/full-checks.yml
