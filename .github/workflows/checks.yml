# Checks on every PR and push to main (README, "Tests"): repo checks, unit tests and the type check, secret scan, and
# the browser tests (the real Worker in Node serving this checkout as /ui/0.0.0-dev/): every spec in Chromium, the
# gallery smoke spec in Firefox and WebKit. Jobs run side by side; the browser tests are split over parallel jobs
# (Chromium in three shards, Firefox + WebKit, the jank gate alone) and the `e2e` job passes only when all of them do.
# app-devkit blocks are pinned to an exact version; other actions by commit SHA (Dependabot bumps both).
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: flamingbeing/app-devkit/setup-node@v1.11.0
      - uses: flamingbeing/app-devkit/setup-tools@v1.11.0
      - run: node .devkit/tools/check.mjs
      - run: node .devkit/tools/proofread.mjs
      - run: node .devkit/tools/check-links.mjs .
      - name: The package.json version is locked; relative imports only; no inline script or style in the gallery
        run: node tools/check.mjs
      - name: Unit tests (Worker, UI core, tools)
        run: npm test
      - name: Type check (ui, theme, settings, kit under strict)
        run: npm run typecheck

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, checksum checked)
        env:
          V: 8.28.0
          SHA: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "$SHA  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner .

  # One runner per entry. The jank gate times frames, so it gets a runner to itself and runs one test at a time
  # (--workers=1: Chromium then WebKit); --no-deps because the browser projects it follows in playwright.config run in
  # the other entries.
  e2e-split:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1 of 3, key: chromium-1, browsers: chromium, args: --project=phone --shard=1/3 }
          - { name: chromium 2 of 3, key: chromium-2, browsers: chromium, args: --project=phone --shard=2/3 }
          - { name: chromium 3 of 3, key: chromium-3, browsers: chromium, args: --project=phone --shard=3/3 }
          - { name: firefox webkit, key: firefox-webkit, browsers: firefox webkit, webkit: true, args: --project=firefox --project=webkit }
          - { name: jank, key: jank, browsers: chromium webkit, webkit: true, args: --project=jank --project=jank-webkit --no-deps --workers=1 }
    steps:
      # A PR that changes only .md files skips the browser steps below; the job still runs and reports success, so the
      # check never hangs. Compares the event's base and head commits (a re-run judges the same commits); renames count by both names. Pushes to main always run everything; any doubt (API error, 3000+
      # files) runs everything. Unit tests (the checks job, which reads NOTES.md) always run.
      - name: Only .md files changed?
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, (.previous_filename // empty)')" && [ -n "$files" ]; then
            n="$(printf '%s\n' "$files" | wc -l)"
            if [ "$n" -lt 3000 ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then docs=true; fi
          fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.docs.outputs.docs != 'true'
      - uses: flamingbeing/app-devkit/setup-node@v1.11.0
        if: steps.docs.outputs.docs != 'true'
      - uses: flamingbeing/app-devkit/setup-browser@v1.11.0
        if: steps.docs.outputs.docs != 'true'
        with:
          browsers: ${{ matrix.browsers }}
      - name: WebKit's system libraries
        if: steps.docs.outputs.docs != 'true' && matrix.webkit
        run: npx playwright install-deps webkit
      - run: npx playwright test ${{ matrix.args }}
        if: steps.docs.outputs.docs != 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results-${{ matrix.key }}
          path: test-results
          if-no-files-found: ignore

  # The check name `e2e` stays: it passes only when every entry above passed.
  e2e:
    needs: e2e-split
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every browser-test job passed
        env:
          RESULT: ${{ needs.e2e-split.result }}
        run: |
          echo "e2e-split: $RESULT"
          test "$RESULT" = success
