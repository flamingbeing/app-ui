# Quick checks on every PR and push to main (README, "Tests"): repo checks, unit tests and the type check, secret scan,
# and the Chromium phone browser tests (the real Worker in Node serving this checkout as /ui/0.0.0-dev/) split over
# parallel runners; the `e2e` job passes only when every shard does. Deploy waits for these on main.
# Everything slower is in full-checks.yml ("Full checks": WebKit, Firefox, the jank gate, the @full axe runs; nightly
# with the soak, and by hand with a PR number or ref). Repo variable FULL_CHECKS_ON_PRS=true (Settings, Secrets and
# variables, Actions, Variables) makes PRs run them too.
# app-devkit blocks are pinned to an exact version; other actions by commit SHA (Dependabot bumps both).
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: flamingbeing/app-devkit/setup-node@v1.11.0
      - uses: flamingbeing/app-devkit/setup-tools@v1.11.0
      - run: node .devkit/tools/check.mjs
      - run: node .devkit/tools/proofread.mjs
      - run: node .devkit/tools/check-links.mjs .
      - name: The package.json version is locked; relative imports only; no inline script or style in the gallery
        run: node tools/check.mjs
      - name: Unit tests (Worker, UI core, tools)
        run: npm test
      - name: Type check (ui, theme, settings, kit under strict)
        run: npm run typecheck

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, checksum checked)
        env:
          V: 8.28.0
          SHA: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "$SHA  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner .

  e2e:
    # Chromium phone, split so no shard runs much over a minute (raise `shards` when one does); a PR that changes only
    # docs skips the browser steps and still passes
    uses: flamingbeing/app-devkit/.github/workflows/e2e.yml@v1.14.0
    with:
      shards: 8
      args: --project=phone --grep-invert=@full

  full:
    # the repo variable FULL_CHECKS_ON_PRS=true runs Full checks on PRs as well
    if: github.event_name == 'pull_request' && vars.FULL_CHECKS_ON_PRS == 'true'
    uses: ./.github/workflows/full-checks.yml
