# Full checks: everything slower than the quick Checks (checks.yml): WebKit (the iPhone's engine), Firefox, the jank
# gate, and the heavy axe runs tagged @full (each look's gallery and shell in dark). Runs nightly from soak.yml, by hand
# (Actions, "Full checks", Run workflow; `ref` = a PR number, branch, tag or SHA, empty = main), and on PRs when the
# repo variable FULL_CHECKS_ON_PRS is true. Never after merges or releases.
name: Full checks
on:
  workflow_dispatch:
    inputs:
      ref:
        description: PR number, branch, tag or SHA (empty = main)
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  webkit:
    uses: flamingbeing/app-devkit/.github/workflows/e2e.yml@v1.14.0
    with:
      name: webkit
      ref: ${{ inputs.ref }}
      browsers: webkit
      webkit-deps: true
      args: --project=webkit

  firefox:
    uses: flamingbeing/app-devkit/.github/workflows/e2e.yml@v1.14.0
    with:
      name: firefox
      ref: ${{ inputs.ref }}
      browsers: firefox
      args: --project=firefox

  axe:
    # the @full tests in Chromium phone (the quick Checks leave them out)
    uses: flamingbeing/app-devkit/.github/workflows/e2e.yml@v1.14.0
    with:
      name: axe
      ref: ${{ inputs.ref }}
      args: --project=phone --grep=@full

  jank:
    # the jank gate times frames, so it gets a runner to itself and runs one test at a time (Chromium then WebKit);
    # --no-deps because the projects it follows in playwright.config run in the jobs above or in Checks
    uses: flamingbeing/app-devkit/.github/workflows/e2e.yml@v1.14.0
    with:
      name: jank
      ref: ${{ inputs.ref }}
      browsers: chromium webkit
      webkit-deps: true
      args: --project=jank --project=jank-webkit --no-deps --workers=1
