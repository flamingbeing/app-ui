<!doctype html>
<html lang="en" class="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <title>Plain page</title>
  <!-- A page without the gallery's markup, loading the kit the way an app does (import map, <link> CSS) and showing
       the theme switcher, as the starter app's signed-out page does. Test-only: not part of a release. -->
  <script type="importmap">
{ "imports": { "@core/ui": "../../ui/index.js", "@core/theme": "../../theme/index.js" } }
  </script>
  <script src="../../theme/early.js"></script>
  <link rel="stylesheet" href="https://design.flamingbeing.com/v1/tokens.css">
  <link rel="stylesheet" href="../../theme/theme.css">
  <link rel="stylesheet" href="../../ui/ui.css">
  <link rel="stylesheet" href="../../theme/glass.css">
  <script type="module">
    import { applyTheme, themeSwitch } from '@core/theme';
    applyTheme({ accent: '#3a6390' });
    themeSwitch(document.getElementById('theme-switch'));
  </script>
</head>
<body>
  <header class="bar"><h1>Plain page</h1></header>
  <main>
    <section id="signed-out"><p>Sign in to see the list.</p></section>
  </main>
  <footer><div id="theme-switch"></div></footer>
  <div id="toasts"></div>
</body>
</html>
